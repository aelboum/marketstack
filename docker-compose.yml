# Minimal development-oriented Docker foundation (docs/ROADMAP.md Phase
# 1.1), mirroring saas-os's own root docker-compose.yml shape. All secrets
# come from a local, gitignored `.env` file (copy `.env.example` to `.env`
# and fill in local-only values) -- none are hardcoded or defaulted here.
#
# Two distinct PostgreSQL roles (docs/REPOSITORY-STRATEGY.md, mirroring
# saas-os's own two-role convention -- PostgreSQL RLS, where used, is
# never applied to a superuser or a BYPASSRLS role, no override exists):
#   - POSTGRES_USER: the image's own bootstrap/superuser role. Used only
#     for migrations (MIGRATIONS_DATABASE_URL) -- never by the running
#     application.
#   - APP_DB_USER: a restricted, NOSUPERUSER/NOBYPASSRLS role created by
#     deploy/db-init/01-create-app-role.sh (the official postgres image's
#     own /docker-entrypoint-initdb.d mechanism, run once on first boot of
#     an empty data volume). This is what DATABASE_URL points at.
#
# No ARQ/`infra.jobs` worker service yet -- no such background job is
# defined anywhere in this product (docs/ROADMAP.md Phase 1 scope), so
# there is nothing for one to run; unaffected by anything below (this
# phase's own required outcome 8). Added in the phase that actually
# registers one.
#
# `temporal`/`temporal-worker` (docs/ROADMAP.md Phase 10.3's own
# infrastructure spike, docs/ADR/0007-automation-execution-substrate.md):
# the durable-execution engine and this product's own dedicated worker
# process for it -- a Product-owned infrastructure dependency, external
# to SaaS-OS (`product/automation/durable/__init__.py`'s own docstring).
# `temporal` reuses this same `db` Postgres server (per this phase's own
# instructions: "prefer that over introducing another database engine")
# via `temporalio/auto-setup`'s own bootstrap, which creates its own
# `temporal`/`temporal_visibility` databases inside it on first boot --
# structurally separate from this product's own `POSTGRES_DB` database
# and never touched by `scripts/bootstrap-db.py`/Alembic (this phase's
# own instructions: "do NOT make the Product Alembic migration system
# manage Temporal's internal schema"). `temporal-worker` is a second,
# independent process built from this same image (`command:` override
# only) -- this phase's own required outcome 7 ("Product API and worker
# remain separate processes"); `backend` never depends on either service
# and `product/api/main.py` never imports the durable adapter at all, so
# neither existing (this phase's own required outcome 7/14).
#
# Unlike saas-os's own `backend` service (which publishes no host port,
# behind its own Caddy ingress -- out of scope for this product's Phase
# 1), `backend` here publishes 8000 directly: this frontend's browser-side
# code calls the backend directly (NEXT_PUBLIC_API_URL, the OIDC redirect
# and /auth/me fetch both happen from the browser, not server-side), and
# no reverse proxy exists yet in this repository.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./deploy/db-init/01-create-app-role.sh:/docker-entrypoint-initdb.d/01-create-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - saas_os_pat
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # --- Local self-hosted identity (saas-os docs/LOCAL-IDENTITY.md,
  # "Downstream product development") ---------------------------------
  # A local, disposable ZITADEL instance so `docker compose up` needs no
  # ZITADEL Cloud account or other external OIDC provider. Dedicated
  # PostgreSQL (zitadel-db) -- never this product's own `db` service/
  # database/migrations (mirrors saas-os's own ADR-0023 S5: ZITADEL
  # manages its own schema independently; it must never join this
  # product's Alembic history). `backend` is deliberately NOT made to
  # depend on `zitadel` here -- saas-os's own `core/identity` resolves
  # OIDC discovery lazily on first `/auth/login`, not at process
  # startup. None of this is ever present in a production configuration
  # (no docker-compose.prod.yml exists yet in this repository).
  zitadel-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${ZITADEL_DB_USER}
      POSTGRES_PASSWORD: ${ZITADEL_DB_PASSWORD}
      POSTGRES_DB: ${ZITADEL_DB_NAME}
    volumes:
      - zitadel-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ZITADEL's own process image has no shell and no `chown`/`chmod`
  # binary (distroless-style) and runs as a non-root user, so a freshly
  # created named volume (root-owned by default) makes its own
  # `ZITADEL_FIRSTINSTANCE_PATPATH` write fail with `permission denied`
  # (saas-os's own docker-compose.yml, verified empirically against this
  # pinned image/version). This one-shot `busybox` init fixes that
  # before `zitadel` ever starts.
  zitadel-bootstrap-vol-init:
    image: busybox:1.36.1
    command: ["sh", "-c", "mkdir -p /bootstrap && chmod 0777 /bootstrap"]
    volumes:
      - zitadel-bootstrap:/bootstrap

  zitadel:
    # Pinned exact version (never `latest`), matching saas-os's own
    # docker-compose.yml -- v4.18.0 immediately preceding it is a
    # known-bad release (its own setup step fails).
    image: ghcr.io/zitadel/zitadel:v4.19.0
    command: start-from-init --masterkey "${ZITADEL_LOCAL_MASTERKEY}" --tlsMode disabled
    environment:
      ZITADEL_DATABASE_POSTGRES_HOST: zitadel-db
      ZITADEL_DATABASE_POSTGRES_PORT: "5432"
      ZITADEL_DATABASE_POSTGRES_DATABASE: ${ZITADEL_DB_NAME}
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: ${ZITADEL_DB_USER}
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${ZITADEL_DB_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: ${ZITADEL_DB_USER}
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${ZITADEL_DB_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      # Must match OIDC_ISSUER_URL exactly (saas-os's own
      # core/identity/oidc.py issuer check rejects every token
      # otherwise) -- see the `zitadel.localhost` network alias below,
      # and docs/LOCAL-IDENTITY.md ("Why zitadel.localhost") in the
      # saas-os dependency for the full "why".
      ZITADEL_PORT: ${ZITADEL_LOCAL_PORT}
      ZITADEL_EXTERNALDOMAIN: zitadel.localhost
      ZITADEL_EXTERNALPORT: ${ZITADEL_LOCAL_PORT}
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_TLS_ENABLED: "false"
      # Deterministic first-run bootstrap (ZITADEL's own supported
      # mechanism). Org/admin names are fixed, non-secret local
      # identifiers; only the admin password is a secret, sourced from
      # .env. `product-local` -- this product's own neutral technical
      # identifier (docs/ADR/0001-naming-and-identifier-neutrality.md),
      # never the temporary repository name.
      ZITADEL_FIRSTINSTANCE_ORG_NAME: product-local
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: ${ZITADEL_FIRSTINSTANCE_ADMIN_USERNAME}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_FIRSTINSTANCE_ADMIN_PASSWORD}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_ADDRESS: ${ZITADEL_FIRSTINSTANCE_ADMIN_EMAIL}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_VERIFIED: "true"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false" # pragma: allowlist secret
      # Machine user + PAT, IAM_OWNER-scoped, created at bootstrap and
      # written to ZITADEL_FIRSTINSTANCE_PATPATH -- the credential
      # `zitadel-bootstrap` (below) uses to call ZITADEL's own
      # Management API. The token value itself is generated by
      # ZITADEL, never supplied by this repository.
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: bootstrap
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: bootstrap
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2100-01-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_PATPATH: /bootstrap/bootstrap.pat
      # ZITADEL v4 defaults new instances to "Login V2" (a separate
      # Next.js UI image this single-container local topology does not
      # run) -- falls back to the legacy login UI bundled in this same
      # image, matching saas-os's own local topology exactly.
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "false"
    ports:
      # Local developer/browser convenience only -- the OIDC
      # authorization-redirect leg is a real browser navigation, so
      # ZITADEL must be host-reachable in this topology.
      - "${ZITADEL_LOCAL_PORT}:${ZITADEL_LOCAL_PORT}"
    volumes:
      - zitadel-bootstrap:/bootstrap
    networks:
      default:
        # The reserved `.localhost` TLD (RFC 6761) resolves to
        # 127.0.0.1 on the host with no hosts-file entry needed --
        # registering the exact same name as this container's own
        # Docker-network alias means OIDC_ISSUER_URL can be one
        # identical URL for both the browser (host) and
        # backend/zitadel-bootstrap (in-network), avoiding ZITADEL's
        # Host-header instance-routing 404 otherwise.
        aliases:
          - zitadel.localhost
    depends_on:
      zitadel-db:
        condition: service_healthy
      zitadel-bootstrap-vol-init:
        condition: service_completed_successfully
    healthcheck:
      # ZITADEL's own image has no shell/curl/wget -- `zitadel ready`
      # is the binary's own supported readiness probe.
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 10

  # One-shot, idempotent. Runs this product's own `backend` image, which
  # already has the `saas-os` dependency (and its installed console
  # scripts) on its PATH -- `saas-os-local-identity` is the same
  # command a consuming project runs from its own image
  # (saas-os docs/LOCAL-IDENTITY.md, "Downstream product development").
  # No SaaS-OS Python source is copied into this repository.
  zitadel-bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - saas_os_pat
    entrypoint: ["saas-os-local-identity"]
    environment:
      # Same URL a browser on the host would use (see the `zitadel`
      # service's own `networks.default.aliases` comment above).
      ZITADEL_INTERNAL_URL: http://zitadel.localhost:${ZITADEL_LOCAL_PORT}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI}
      OIDC_LOCAL_PROJECT_NAME: ${OIDC_LOCAL_PROJECT_NAME}
      OIDC_LOCAL_APPLICATION_NAME: ${OIDC_LOCAL_APPLICATION_NAME}
    volumes:
      - zitadel-bootstrap:/bootstrap:ro
    depends_on:
      zitadel:
        condition: service_healthy

  # Phase 10.3 infrastructure spike only (module comment above) -- not
  # depended on by `backend` or `frontend`, and not required for this
  # product to build, start, or serve any existing route.
  temporal:
    image: temporalio/auto-setup:1.29.7
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PWD: ${POSTGRES_PASSWORD}
      POSTGRES_SEEDS: db
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"
    depends_on:
      db:
        condition: service_healthy

  temporal-worker:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - saas_os_pat
    command: ["python", "-m", "product.automation.durable.worker"]
    env_file:
      - .env
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      - temporal
    restart: on-failure

volumes:
  db-data:
  zitadel-db-data:
  zitadel-bootstrap:

secrets:
  # A token with read access to the private aelboum/saas-os repo, sourced
  # from the SAAS_OS_PAT environment variable (already required in a
  # local .env, same as every other value below) -- pip's internal git
  # clone of the pinned saas-os commit needs it during `backend`'s build.
  saas_os_pat:
    environment: SAAS_OS_PAT
