# Minimal development-oriented Docker foundation (docs/ROADMAP.md Phase
# 1.1), mirroring saas-os's own root docker-compose.yml shape. All secrets
# come from a local, gitignored `.env` file (copy `.env.example` to `.env`
# and fill in local-only values) -- none are hardcoded or defaulted here.
#
# Two distinct PostgreSQL roles (docs/REPOSITORY-STRATEGY.md, mirroring
# saas-os's own two-role convention -- PostgreSQL RLS, where used, is
# never applied to a superuser or a BYPASSRLS role, no override exists):
#   - POSTGRES_USER: the image's own bootstrap/superuser role. Used only
#     for migrations (MIGRATIONS_DATABASE_URL) -- never by the running
#     application.
#   - APP_DB_USER: a restricted, NOSUPERUSER/NOBYPASSRLS role created by
#     deploy/db-init/01-create-app-role.sh (the official postgres image's
#     own /docker-entrypoint-initdb.d mechanism, run once on first boot of
#     an empty data volume). This is what DATABASE_URL points at.
#
# No ARQ/`infra.jobs` worker service yet -- no such background job is
# defined anywhere in this product (docs/ROADMAP.md Phase 1 scope), so
# there is nothing for one to run; unaffected by anything below (this
# phase's own required outcome 8). Added in the phase that actually
# registers one.
#
# `temporal`/`temporal-worker` (docs/ROADMAP.md Phase 10.3's own
# infrastructure spike, docs/ADR/0007-automation-execution-substrate.md):
# the durable-execution engine and this product's own dedicated worker
# process for it -- a Product-owned infrastructure dependency, external
# to SaaS-OS (`product/automation/durable/__init__.py`'s own docstring).
# `temporal` reuses this same `db` Postgres server (per this phase's own
# instructions: "prefer that over introducing another database engine")
# via `temporalio/auto-setup`'s own bootstrap, which creates its own
# `temporal`/`temporal_visibility` databases inside it on first boot --
# structurally separate from this product's own `POSTGRES_DB` database
# and never touched by `scripts/bootstrap-db.py`/Alembic (this phase's
# own instructions: "do NOT make the Product Alembic migration system
# manage Temporal's internal schema"). `temporal-worker` is a second,
# independent process built from this same image (`command:` override
# only) -- this phase's own required outcome 7 ("Product API and worker
# remain separate processes"); `backend` never depends on either service
# and `product/api/main.py` never imports the durable adapter at all, so
# neither existing (this phase's own required outcome 7/14).
#
# `backend` still publishes 8000 directly (direct API access for existing
# developer tooling -- curl, migrations, etc.) even though the browser no
# longer talks to it there. As of the local single-origin routing phase,
# a minimal `edge` service (Caddy, emitted by the installed saas-os
# dependency's own `saas-os-edge-config` console script -- ADR-0024's
# reusable single-origin application runtime, mirroring saas-os's own
# Caddy ingress pattern for its `backend`) is the one browser-facing
# origin: NEXT_PUBLIC_API_URL, the OIDC redirect (now derived from
# PUBLIC_APP_ORIGIN, see .env.example), and the /auth/me fetch all
# happen from the browser (unchanged), but now against `edge`
# (http://localhost:${EDGE_LOCAL_PORT:-8080}), which forwards /auth,
# /v1, /healthz, /readyz to `backend` and everything else to `frontend`
# (deploy/caddy/Caddyfile.local -- this project's own copy of that
# emitted file, per ADR-0015 rules 9/10). `frontend` no longer publishes
# a host port -- see that service's own comment below.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./deploy/db-init/01-create-app-role.sh:/docker-entrypoint-initdb.d/01-create-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - saas_os_pat
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* must be present at build time (Next.js
        # convention) -- a container ENV set later at `up` would be too
        # late, the client bundle is already compiled. Never a secret
        # (frontend/lib/api/config.ts's own docstring).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    env_file:
      - .env
    # No host port published: the browser now reaches this only through
    # `edge` (below), on the compose network by service name -- see
    # docker-compose.yml's own top-of-file comment (this was the
    # "frontend :3000, backend :8000, no reverse proxy" state before this
    # phase). Also sidesteps port 3000 already being held by another,
    # unrelated local process (out of this phase's scope -- reported
    # separately, not fixed here).
    depends_on:
      - backend

  edge:
    # Local single-origin browser routing (ADR-0024, saas-os's own
    # reusable `infra.edge` single-origin application runtime -- see
    # docs/ROADMAP.md UI Track routing phase). `deploy/caddy/Caddyfile.local`
    # is emitted by that dependency's own `saas-os-edge-config` console
    # script (never hand-authored/copied here -- ADR-0015 rules 9/10);
    # once emitted it is this repository's own file to maintain. Its
    # listener is always :8080 inside the container -- only the
    # published host port is this project's own concern.
    image: caddy:2-alpine
    volumes:
      - ./deploy/caddy/Caddyfile.local:/etc/caddy/Caddyfile:ro
    ports:
      - "${EDGE_LOCAL_PORT:-8080}:8080"
    depends_on:
      - backend
      - frontend
      - login-service

  # --- Local self-hosted identity (saas-os docs/LOCAL-IDENTITY.md,
  # "Downstream product development") ---------------------------------
  # A local, disposable ZITADEL instance so `docker compose up` needs no
  # ZITADEL Cloud account or other external OIDC provider. Dedicated
  # PostgreSQL (zitadel-db) -- never this product's own `db` service/
  # database/migrations (mirrors saas-os's own ADR-0023 S5: ZITADEL
  # manages its own schema independently; it must never join this
  # product's Alembic history). `backend` is deliberately NOT made to
  # depend on `zitadel` here -- saas-os's own `core/identity` resolves
  # OIDC discovery lazily on first `/auth/login`, not at process
  # startup. None of this is ever present in a production configuration
  # (no docker-compose.prod.yml exists yet in this repository).
  zitadel-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${ZITADEL_DB_USER}
      POSTGRES_PASSWORD: ${ZITADEL_DB_PASSWORD}
      POSTGRES_DB: ${ZITADEL_DB_NAME}
    volumes:
      - zitadel-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ZITADEL's own process image has no shell and no `chown`/`chmod`
  # binary (distroless-style) and runs as a non-root user, so a freshly
  # created named volume (root-owned by default) makes its own
  # `ZITADEL_FIRSTINSTANCE_PATPATH` write fail with `permission denied`
  # (saas-os's own docker-compose.yml, verified empirically against this
  # pinned image/version). This one-shot `busybox` init fixes that
  # before `zitadel` ever starts.
  zitadel-bootstrap-vol-init:
    image: busybox:1.36.1
    command: ["sh", "-c", "mkdir -p /bootstrap && chmod 0777 /bootstrap"]
    volumes:
      - zitadel-bootstrap:/bootstrap

  # Development-only SMTP catcher (docs/ROADMAP.md forgot-password wiring,
  # login-service's own ADR-0017 "deferred limitations" -- now wired up).
  # ZITADEL's SMTP config (`zitadel-smtp-configure` below) points at this
  # container instead of a real provider, so every password-reset/
  # invitation email ZITADEL sends lands here instead of a real mailbox --
  # readable at http://localhost:8025. Never used in production; a real
  # SMTP provider is a future, environment-specific config, not this
  # compose file's concern.
  mailpit:
    image: axllent/mailpit:v1.31.3
    ports:
      - "${MAILPIT_LOCAL_WEB_PORT}:8025"
    # SMTP port 1025 is deliberately not published to the host -- only
    # `zitadel` (in-network, by service name) ever sends mail.

  zitadel:
    # Pinned exact version (never `latest`), matching saas-os's own
    # docker-compose.yml -- v4.18.0 immediately preceding it is a
    # known-bad release (its own setup step fails).
    image: ghcr.io/zitadel/zitadel:v4.19.0
    command: start-from-init --masterkey "${ZITADEL_LOCAL_MASTERKEY}" --tlsMode disabled
    environment:
      ZITADEL_DATABASE_POSTGRES_HOST: zitadel-db
      ZITADEL_DATABASE_POSTGRES_PORT: "5432"
      ZITADEL_DATABASE_POSTGRES_DATABASE: ${ZITADEL_DB_NAME}
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: ${ZITADEL_DB_USER}
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${ZITADEL_DB_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: ${ZITADEL_DB_USER}
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${ZITADEL_DB_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      # Must match OIDC_ISSUER_URL exactly (saas-os's own
      # core/identity/oidc.py issuer check rejects every token
      # otherwise) -- see the `zitadel.localhost` network alias below,
      # and docs/LOCAL-IDENTITY.md ("Why zitadel.localhost") in the
      # saas-os dependency for the full "why".
      ZITADEL_PORT: ${ZITADEL_LOCAL_PORT}
      ZITADEL_EXTERNALDOMAIN: zitadel.localhost
      ZITADEL_EXTERNALPORT: ${ZITADEL_LOCAL_PORT}
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_TLS_ENABLED: "false"
      # Deterministic first-run bootstrap (ZITADEL's own supported
      # mechanism). Org/admin names are fixed, non-secret local
      # identifiers; only the admin password is a secret, sourced from
      # .env. `product-local` -- this product's own neutral technical
      # identifier (docs/ADR/0001-naming-and-identifier-neutrality.md),
      # never the temporary repository name.
      ZITADEL_FIRSTINSTANCE_ORG_NAME: product-local
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: ${ZITADEL_FIRSTINSTANCE_ADMIN_USERNAME}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_FIRSTINSTANCE_ADMIN_PASSWORD}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_ADDRESS: ${ZITADEL_FIRSTINSTANCE_ADMIN_EMAIL}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_VERIFIED: "true"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false" # pragma: allowlist secret
      # Machine user + PAT, IAM_OWNER-scoped, created at bootstrap and
      # written to ZITADEL_FIRSTINSTANCE_PATPATH -- the credential
      # `zitadel-bootstrap` (below) uses to call ZITADEL's own
      # Management API. The token value itself is generated by
      # ZITADEL, never supplied by this repository.
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: bootstrap
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: bootstrap
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2100-01-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_PATPATH: /bootstrap/bootstrap.pat
      # ZITADEL v4 defaults new instances to "Login V2" (a separate
      # Next.js UI image this single-container local topology does not
      # run) -- falls back to the legacy login UI bundled in this same
      # image, matching saas-os's own local topology exactly.
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "false"
    ports:
      # Local developer/browser convenience only -- the OIDC
      # authorization-redirect leg is a real browser navigation, so
      # ZITADEL must be host-reachable in this topology.
      - "${ZITADEL_LOCAL_PORT}:${ZITADEL_LOCAL_PORT}"
    volumes:
      - zitadel-bootstrap:/bootstrap
    networks:
      default:
        # The reserved `.localhost` TLD (RFC 6761) resolves to
        # 127.0.0.1 on the host with no hosts-file entry needed --
        # registering the exact same name as this container's own
        # Docker-network alias means OIDC_ISSUER_URL can be one
        # identical URL for both the browser (host) and
        # backend/zitadel-bootstrap (in-network), avoiding ZITADEL's
        # Host-header instance-routing 404 otherwise.
        aliases:
          - zitadel.localhost
    depends_on:
      zitadel-db:
        condition: service_healthy
      zitadel-bootstrap-vol-init:
        condition: service_completed_successfully
    healthcheck:
      # ZITADEL's own image has no shell/curl/wget -- `zitadel ready`
      # is the binary's own supported readiness probe.
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 10

  # One-shot, idempotent. Runs this product's own `backend` image, which
  # already has the `saas-os` dependency (and its installed console
  # scripts) on its PATH -- `saas-os-local-identity` is the same
  # command a consuming project runs from its own image
  # (saas-os docs/LOCAL-IDENTITY.md, "Downstream product development").
  # No SaaS-OS Python source is copied into this repository.
  zitadel-bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - saas_os_pat
    entrypoint: ["saas-os-local-identity"]
    environment:
      # Same URL a browser on the host would use (see the `zitadel`
      # service's own `networks.default.aliases` comment above).
      ZITADEL_INTERNAL_URL: http://zitadel.localhost:${ZITADEL_LOCAL_PORT}
      # ADR-0024: PUBLIC_APP_ORIGIN is this project's single source for the
      # callback the bootstrap tool registers with ZITADEL; OIDC_REDIRECT_URI
      # stays supported as the escape hatch (infra.edge.resolve_callback_url
      # rejects the two disagreeing rather than picking one silently).
      PUBLIC_APP_ORIGIN: ${PUBLIC_APP_ORIGIN}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI}
      OIDC_LOCAL_PROJECT_NAME: ${OIDC_LOCAL_PROJECT_NAME}
      OIDC_LOCAL_APPLICATION_NAME: ${OIDC_LOCAL_APPLICATION_NAME}
    volumes:
      - zitadel-bootstrap:/bootstrap:ro
    depends_on:
      zitadel:
        condition: service_healthy

  # Marketstack-owned post-bootstrap step (docs/ADR/0017): sets
  # loginVersion.loginV2.baseUri on the application `zitadel-bootstrap`
  # (above) just created -- saas-os-local-identity itself has no concept
  # of this field (verified against the pinned saas-os commit). Runs the
  # product's own scripts/configure_zitadel_login_v2.py, never SaaS-OS
  # source, using the `backend` image (scripts/ is excluded from that
  # image itself -- .dockerignore -- so it is bind-mounted here, mirroring
  # scripts/check-docker.sh's own identical pattern for the same reason).
  # Reuses the same bootstrap PAT `zitadel-bootstrap` used (a LOCAL/
  # BOOTSTRAP credential only -- see that script's own module docstring
  # for why this is never the future Login service's own credential).
  # A no-op, not an error, when ZITADEL_LOGIN_V2_BASE_URI is unset
  # (.env.example default).
  zitadel-login-v2-configure:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - saas_os_pat
    entrypoint: ["python", "scripts/configure_zitadel_login_v2.py"]
    env_file:
      - .env
    environment:
      ZITADEL_INTERNAL_URL: http://zitadel.localhost:${ZITADEL_LOCAL_PORT}
    volumes:
      - zitadel-bootstrap:/bootstrap:ro
      - ./scripts:/app/scripts:ro
    depends_on:
      zitadel-bootstrap:
        condition: service_completed_successfully

  # Marketstack-owned post-bootstrap step, same shape as
  # `zitadel-login-v2-configure` above: points ZITADEL's instance-level
  # SMTP config (`AdminService.AddEmailProviderSMTP`/`ActivateEmailProvider`
  # -- saas-os-local-identity has no concept of this either) at the
  # `mailpit` service above, so ZITADEL's own password-reset/invitation
  # emails actually send somewhere in local dev. Reuses the same bootstrap
  # PAT (IAM_OWNER-scoped) for the same reason
  # scripts/configure_zitadel_login_v2.py already does -- never a
  # service's own runtime credential.
  zitadel-smtp-configure:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - saas_os_pat
    entrypoint: ["python", "scripts/configure_zitadel_smtp.py"]
    env_file:
      - .env
    environment:
      ZITADEL_INTERNAL_URL: http://zitadel.localhost:${ZITADEL_LOCAL_PORT}
    volumes:
      - zitadel-bootstrap:/bootstrap:ro
      - ./scripts:/app/scripts:ro
    depends_on:
      zitadel-bootstrap:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  # Login Service (docs/ADR/0017-product-owned-zitadel-login-service.md)
  # -- a separate, product-owned service (./login-service, its own image,
  # its own dependency set; never imports saas-os or product.*). Two
  # services: a one-shot provisioning step (mirrors zitadel-bootstrap's
  # own shape) that creates this service's dedicated ZITADEL machine-user
  # credential using the bootstrap PAT as a one-time administrative
  # action, and the service itself, which never receives that PAT and
  # talks to ZITADEL only with its own, separately-scoped credential
  # (IAM_LOGIN_CLIENT -- session.write/session.link/session.delete/
  # user.read; NOT project.app.write, which stays with
  # zitadel-login-v2-configure's own credential above).
  # Same fresh-named-volume permission problem `zitadel-bootstrap-vol-init`
  # already solves above (this product's own backend image's non-root
  # `app` user vs. a root-owned freshly created volume) -- identical fix.
  login-service-credential-vol-init:
    image: busybox:1.36.1
    command: ["sh", "-c", "mkdir -p /credential && chmod 0777 /credential"]
    volumes:
      - login-service-credential:/credential

  login-service-provision:
    build:
      context: .
      # Security audit F-13: a dedicated minimal image (httpx +
      # cryptography only) instead of the full product image -- see
      # Dockerfile.login-service-provision's own module comment. The
      # `saas_os_pat` secret below is unused by this Dockerfile (it
      # never clones saas-os), kept only because this block's own
      # `secrets:`/volumes/environment/depends_on are otherwise
      # unchanged by this task.
      dockerfile: Dockerfile.login-service-provision
      secrets:
        - saas_os_pat
    entrypoint: ["python", "scripts/provision_login_service_credential.py"]
    environment:
      ZITADEL_INTERNAL_URL: http://zitadel.localhost:${ZITADEL_LOCAL_PORT}
      OIDC_LOCAL_PROJECT_NAME: ${OIDC_LOCAL_PROJECT_NAME}
      LOGIN_SERVICE_CREDENTIAL_DIR: /credential
    volumes:
      - zitadel-bootstrap:/bootstrap:ro
      - ./scripts:/app/scripts:ro
      - login-service-credential:/credential
    depends_on:
      zitadel-bootstrap:
        condition: service_completed_successfully
      login-service-credential-vol-init:
        condition: service_completed_successfully

  login-service:
    build:
      context: ./login-service
      dockerfile: Dockerfile
    environment:
      ZITADEL_ISSUER_URL: http://zitadel.localhost:${ZITADEL_LOCAL_PORT}
      LOGIN_SERVICE_PRIVATE_KEY_PATH: /credential/private_key.pem
      LOGIN_SERVICE_PUBLIC_ORIGIN: ${PUBLIC_APP_ORIGIN:-http://localhost:8080}
      # security audit F-03: no ":-false" fallback here on purpose -- an
      # unset/empty LOGIN_SERVICE_COOKIE_SECURE must fall through to
      # app/config.py's own secure-by-default (True), never be silently
      # forced insecure by this compose file. .env.example ships an
      # explicit `false` for local plaintext-HTTP dev, same as
      # AUTH_COOKIE_SECURE's own convention; LOGIN_SERVICE_ENVIRONMENT
      # left unset (defaults to "development") is what makes that
      # explicit `false` acceptable here -- see app/config.py's own
      # __post_init__ guard, which rejects the combination outright once
      # LOGIN_SERVICE_ENVIRONMENT=production.
      LOGIN_SERVICE_COOKIE_SECURE: ${LOGIN_SERVICE_COOKIE_SECURE:-}
      LOGIN_SERVICE_BRAND_NAME: ${LOGIN_SERVICE_BRAND_NAME:-Product}
    volumes:
      - login-service-credential:/credential:ro
    depends_on:
      login-service-provision:
        condition: service_completed_successfully
      zitadel:
        condition: service_healthy

  # Phase 10.3 infrastructure spike only (module comment above) -- not
  # depended on by `backend` or `frontend`, and not required for this
  # product to build, start, or serve any existing route.
  temporal:
    image: temporalio/auto-setup:1.29.7
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PWD: ${POSTGRES_PASSWORD}
      POSTGRES_SEEDS: db
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/docker.yaml
    ports:
      - "7233:7233"
    depends_on:
      db:
        condition: service_healthy

  temporal-worker:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - saas_os_pat
    command: ["python", "-m", "product.automation.durable.worker"]
    env_file:
      - .env
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      - temporal
    restart: on-failure

volumes:
  db-data:
  zitadel-db-data:
  zitadel-bootstrap:
  login-service-credential:

secrets:
  # A token with read access to the private aelboum/saas-os repo, sourced
  # from the SAAS_OS_PAT environment variable (already required in a
  # local .env, same as every other value below) -- pip's internal git
  # clone of the pinned saas-os commit needs it during `backend`'s build.
  saas_os_pat:
    environment: SAAS_OS_PAT
