[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# Neutral technical identifier -- never this product's own temporary
# working name. See docs/ADR/0001-naming-and-identifier-neutrality.md and
# README.md for what that name is and why it is kept out of this file.
name = "product"
version = "0.0.1"
description = "Agency-oriented SaaS platform, built on the saas-os platform foundation. See README.md and docs/."
requires-python = ">=3.13"
readme = "README.md"
license = { text = "UNLICENSED" }

# Pinned Git/VCS dependency, exact commit SHA (never a mutable tag/branch) --
# docs/REPOSITORY-STRATEGY.md, mirroring saas-os's own ADR-0015 rules 6-8.
#
# `temporalio` (docs/ROADMAP.md Phase 10.3 durability spike,
# docs/ADR/0007-automation-execution-substrate.md): the durable
# workflow-execution engine's own Python SDK -- a Product-owned
# infrastructure dependency, external to SaaS-OS (never added to
# saas-os's own pyproject.toml, never imported by anything under `core`/
# `infra`/`api` -- see product/automation/durable/__init__.py's own
# docstring for the enforced boundary). Pinned to an exact version, not
# `>=`, mirroring the `[security]` extra's own exact-pinned `detect-
# secrets` dependency below: an unpinned durable-engine SDK is a
# determinism hazard for exactly the same reason -- a later release
# changing wire/serialization behavior could silently change how an
# in-flight workflow replays. Verified against PyPI at pin time:
# 1.33.0 declares `requires_python >= 3.10` and ships a prebuilt
# `cp310-abi3` wheel for win_amd64/linux/macos (no C toolchain needed to
# install on this repository's `python:3.13-slim` image or this Windows
# dev machine).
dependencies = [
    "saas-os @ git+https://github.com/aelboum/saas-os@1d6fd07a0c3ce2dd8a12c09dac86b019781ee6c6",
    "temporalio==1.33.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyright>=1.1",
    "import-linter>=2.0",
]
# Security tooling (docs/ROADMAP.md Phase 1.5): dev-only, not part of the
# runtime image (Dockerfile installs only [project] dependencies).
# detect-secrets is pinned to an EXACT version, mirroring saas-os's own
# pyproject.toml -- an unbounded `>=` is a determinism hazard specific to
# this one package: a later release changing a plugin's heuristics can
# make the same repository content scan differently, silently invalidating
# .secrets.baseline's own recorded findings without any code change.
security = [
    "pip-audit>=2.7",
    "detect-secrets==1.5.0",
]

[tool.setuptools]
packages = [
    "product",
    "product.foundation",
    "product.agency",
    "product.crm",
    "product.marketing",
    "product.conversations",
    "product.telephony",
    "product.ai",
    "product.appointments",
    "product.automation",
    "product.automation.durable",
    "product.reputation",
    "product.websites",
    "product.billing",
    "product.accounting",
    "product.reporting",
    "product.white_label",
    "product.templates",
    "product.integrations",
    "product.api",
]

# product/migrations/ is deliberately NOT in `packages` above -- like
# saas-os's own infra/db/migrations/, an Alembic script directory is a
# plain-file directory (env.py, script.py.mako, versions/*.py), not an
# import target, even though it happens to also carry an __init__.py here
# for docstring/ownership purposes. It never needs to be shipped as
# installable package data in this repository (unlike saas-os's own
# migrations, which must ship *inside* the wheel for a consumer to run --
# this product's own migrations already live in this same repository, run
# directly from the working tree via alembic.ini, never installed
# elsewhere).

# --- Ruff (lint + format) --------------------------------------------------
[tool.ruff]
target-version = "py313"
line-length = 100
src = ["product", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"product/api/**/*.py" = ["B008"]
# FastAPI's own dependency idiom (`Depends(...)` as an argument default) --
# mirrors saas-os's own examples/reference-consumer/reference_consumer/routes.py,
# which ignores the identical rule for the identical reason.
"product/agency/routes.py" = ["B008"]
"product/crm/routes.py" = ["B008"]
"product/conversations/routes.py" = ["B008"]
"product/marketing/routes.py" = ["B008"]
"product/appointments/routes.py" = ["B008"]
"product/telephony/routes.py" = ["B008"]
"product/automation/routes.py" = ["B008"]
"product/automation/durable/routes.py" = ["B008"]

# --- Pyright (type checking) -----------------------------------------------
[tool.pyright]
include = ["product", "scripts", "tests", "conftest.py"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

# --- pytest ------------------------------------------------------------
# `integration` tests need a real disposable PostgreSQL/Redis instance and
# are excluded from the default run (mirrors saas-os's own pyproject.toml
# convention exactly) -- scripts/check-backend.sh must not depend on an
# external database/broker. Run them explicitly via
# scripts/check-integration.sh (`pytest -m integration`).
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m \"not integration and not temporal\""
markers = [
    "integration: requires a real disposable PostgreSQL and/or Redis instance; excluded by default, see scripts/check-integration.sh",
    "temporal: requires outbound network access (first run only, to download the Temporal CLI dev-server binary used by temporalio.testing.WorkflowEnvironment) and spins a real ephemeral Temporal server; excluded by default, see docs/ADR/0007-automation-execution-substrate.md's Phase 10.3 spike section for how to run these manually.",
]

# --- import-linter: enforces docs/ARCHITECTURE.md section 2.2's rule --
# "Every product/<module> MUST NOT depend on any other product/<module>
# directly" -- product.foundation and product.api are deliberately
# excluded from the independence set below: foundation is the one shared
# dependency every module may use, api is the composition root that
# legitimately imports every module's router. See docs/ROADMAP.md Phase
# 1.4 for the non-vacuousness proof this contract is checked against.
[tool.importlinter]
root_packages = ["product"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Product modules do not depend on each other directly"
type = "independence"
modules = [
    "product.agency",
    "product.crm",
    "product.conversations",
    "product.telephony",
    "product.reputation",
    "product.websites",
    "product.billing",
    "product.accounting",
    "product.reporting",
    "product.white_label",
    "product.templates",
    "product.integrations",
]

# Phase 6: product.marketing is deliberately NOT in the independence list
# above -- it has its own, more precise pair of contracts below instead
# (docs/ADR/0005-marketing-and-appointments-depend-on-crm.md): independent
# from every module except product.crm, and a one-directional layers
# contract permitting product.marketing -> product.crm, never the
# reverse. This is a narrow, CRM-specific exception, not a loosening of
# the blanket rule above for any other module.
#
# Phase 7.1-7.2: product.appointments joins product.marketing as a second
# source_module on the same forbidden contract below (both removed from
# the blanket independence list above), plus its own, separate layers
# contract -- see docs/ADR/0005-marketing-and-appointments-depend-on-crm.md's
# own extension for why this is two layers contracts, not one multi-layer
# contract folding Marketing and Appointments into the same layer (that
# shape would also permit Marketing <-> Appointments, which is not part
# of this decision).
[[tool.importlinter.contracts]]
name = "Marketing and Appointments do not depend on any product module except CRM"
type = "forbidden"
source_modules = ["product.marketing", "product.appointments"]
forbidden_modules = [
    "product.agency",
    "product.marketing",
    "product.conversations",
    "product.telephony",
    "product.ai",
    "product.appointments",
    "product.automation",
    "product.reputation",
    "product.websites",
    "product.billing",
    "product.accounting",
    "product.reporting",
    "product.white_label",
    "product.templates",
    "product.integrations",
    "product.api",
]

[[tool.importlinter.contracts]]
name = "Marketing may depend on CRM, never CRM on Marketing"
type = "layers"
layers = [
    "product.marketing",
    "product.crm",
]

[[tool.importlinter.contracts]]
name = "Appointments may depend on CRM, never CRM on Appointments"
type = "layers"
layers = [
    "product.appointments",
    "product.crm",
]

# Phase 9: product.ai (docs/ADR/0006-ai-depends-on-crm-conversations-telephony.md)
# needs a wider, but still narrow and one-directional, set of edges than
# Marketing/Appointments' single CRM exception -- every registered
# control_plane tool wraps exactly one bounded, already-RBAC-gated read
# against the product module it assists (crm.contacts/crm.opportunities
# for lead qualification/suggested next actions, conversations.messages
# for summarization/suggested replies, telephony.calls for the AI
# receptionist's advisory read) -- never a second, competing read path
# into any of their own tables. A separate forbidden contract (not folded
# into the Marketing/Appointments one above, which is explicitly
# CRM-only) plus three separate layers contracts -- one per dependency
# edge, never a single multi-layer contract, for the identical reason
# Marketing/Appointments' own comment already gives: a shared layer would
# also permit product.crm <-> product.conversations <-> product.telephony
# through product.ai as an intermediary, which is not part of this
# decision.
[[tool.importlinter.contracts]]
name = "AI does not depend on any product module except CRM, Conversations, or Telephony"
type = "forbidden"
source_modules = ["product.ai"]
forbidden_modules = [
    "product.agency",
    "product.marketing",
    "product.appointments",
    "product.automation",
    "product.reputation",
    "product.websites",
    "product.billing",
    "product.accounting",
    "product.reporting",
    "product.white_label",
    "product.templates",
    "product.integrations",
    "product.api",
]

[[tool.importlinter.contracts]]
name = "AI may depend on CRM, never CRM on AI"
type = "layers"
layers = [
    "product.ai",
    "product.crm",
]

[[tool.importlinter.contracts]]
name = "AI may depend on Conversations, never Conversations on AI"
type = "layers"
layers = [
    "product.ai",
    "product.conversations",
]

[[tool.importlinter.contracts]]
name = "AI may depend on Telephony, never Telephony on AI"
type = "layers"
layers = [
    "product.ai",
    "product.telephony",
]

# Phase 10.2: product.automation (docs/ADR/0008-automation-depends-on-crm.md)
# needs the identical single-CRM-dependency shape Marketing/Appointments
# already established (ADR-0005) -- create_task/update_contact/
# move_opportunity actions each wrap exactly one bounded, already-RBAC-gated
# CRM write. A separate contract pair (not folded into the Marketing/
# Appointments one, which predates this phase and is documented under its
# own ADR) mirrors AI's own identical choice above for the same reason.
[[tool.importlinter.contracts]]
name = "Automation does not depend on any product module except CRM"
type = "forbidden"
source_modules = ["product.automation"]
forbidden_modules = [
    "product.agency",
    "product.marketing",
    "product.conversations",
    "product.telephony",
    "product.ai",
    "product.appointments",
    "product.reputation",
    "product.websites",
    "product.billing",
    "product.accounting",
    "product.reporting",
    "product.white_label",
    "product.templates",
    "product.integrations",
    "product.api",
]

[[tool.importlinter.contracts]]
name = "Automation may depend on CRM, never CRM on Automation"
type = "layers"
layers = [
    "product.automation",
    "product.crm",
]

# Phase 1's independence contract above only forbids sibling
# product.<module> packages from importing each other -- it does not
# separately enforce docs/ARCHITECTURE.md section 2.2's own explicit
# rule that "foundation itself must never import any other
# product/<module>" (foundation is deliberately excluded from the
# independence contract's module list, since it is the one always-
# allowed dependency *target*, not a checked sibling). Added in Phase 2
# now that product/foundation/ carries real code for the first time.
[[tool.importlinter.contracts]]
name = "Foundation does not depend on any other product module"
type = "forbidden"
source_modules = ["product.foundation"]
forbidden_modules = [
    "product.agency",
    "product.crm",
    "product.marketing",
    "product.conversations",
    "product.telephony",
    "product.ai",
    "product.appointments",
    "product.automation",
    "product.reputation",
    "product.websites",
    "product.billing",
    "product.accounting",
    "product.reporting",
    "product.white_label",
    "product.templates",
    "product.integrations",
    "product.api",
]
